name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, tipos e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-nao-usar-em-producao

  test:
    name: Testes unitários e de integração
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_test?schema=public
      # Sem pooling neste ambiente — mesmo valor de DATABASE_URL, exigido pelo
      # Prisma CLI por causa do `directUrl` em prisma/schema.prisma.
      DIRECT_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_test?schema=public
      AUTH_SECRET: ci-test-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    name: Testes e2e (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_e2e?schema=public
      # Sem pooling neste ambiente — mesmo valor de DATABASE_URL, exigido pelo
      # Prisma CLI por causa do `directUrl` em prisma/schema.prisma.
      DIRECT_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_e2e?schema=public
      AUTH_SECRET: ci-e2e-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Popular banco (seed)
        run: npm run db:seed

      - name: Build de produção
        run: npm run build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar jornadas e2e
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

  docker:
    name: Build da imagem + smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_ai_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (para aplicar migrations do host)
        run: npm ci

      - name: Aplicar migrations no Postgres do job
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_docker?schema=public
          # Sem pooling neste ambiente — mesmo valor de DATABASE_URL, exigido
          # pelo Prisma CLI por causa do `directUrl` em prisma/schema.prisma.
          DIRECT_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_docker?schema=public

      - name: Build da imagem
        run: docker build -t resolve_ai:ci .

      - name: Subir o container
        run: |
          # AUTH_TRUST_HOST=true: fora de uma plataforma com detecção automática de
          # host confiável (Vercel, etc.), Auth.js v5 recusa qualquer rota de auth
          # com 500 UntrustedHost sem isso — confirmado ao vivo com exatamente estas
          # env vars.
          # AUTH_URL não é necessário: com AUTH_TRUST_HOST=true, o login funciona de
          # ponta a ponta (CSRF, callback de credenciais e sessão) mesmo sem AUTH_URL.
          docker run -d --name resolve_ai_ci --network host \
            -e DATABASE_URL=postgresql://resolve:resolve@localhost:5432/resolve_ai_docker?schema=public \
            -e AUTH_SECRET=ci-docker-secret-nao-usar-em-producao \
            -e AUTH_TRUST_HOST=true \
            resolve_ai:ci

      - name: Aguardar o container ficar saudável
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' resolve_ai_ci 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container não ficou saudável a tempo"
          docker logs resolve_ai_ci
          exit 1

      - name: Smoke test — /api/v1/health
        run: |
          curl -sf http://localhost:3000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Smoke test — página inicial responde
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          test "$status" = "200" || (echo "esperado 200, recebido $status" && exit 1)

      - name: Smoke test — login (sem 500 UntrustedHost)
        run: |
          # Este job não semeia o Postgres (só roda migrations — ver step acima),
          # então não há usuário real para logar. O objetivo aqui não é validar a
          # jornada de login completa (isso já é coberto pelo job `e2e`, com banco
          # semeado), e sim travar uma regressão específica já observada: sem
          # AUTH_TRUST_HOST, toda rota de auth responde 500
          # (UntrustedHost) antes mesmo de checar credenciais. Com o host confiável
          # configurado, o fluxo CSRF -> callback de credenciais funciona
          # normalmente e credenciais inexistentes resultam em 302 (redirect para
          # /login?error=CredentialsSignin), nunca 500.
          jar=$(mktemp)
          csrf=$(curl -sf -c "$jar" http://localhost:3000/api/v1/auth/csrf | grep -o '"csrfToken":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$csrf" ]; then
            echo "csrfToken vazio — resposta de /api/v1/auth/csrf:"
            curl -s http://localhost:3000/api/v1/auth/csrf
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" \
            -X POST http://localhost:3000/api/v1/auth/callback/credentials \
            --data-urlencode "csrfToken=$csrf" \
            --data-urlencode "email=smoke-test-sem-usuario@resolveai.com" \
            --data-urlencode "password=SenhaQualquer123" \
            --data-urlencode "json=true")
          test "$status" = "302" || (echo "esperado 302 (CredentialsSignin), recebido $status" && exit 1)

      - name: Logs do container (sempre, para depuração)
        if: always()
        run: docker logs resolve_ai_ci

      - name: Parar o container
        if: always()
        run: docker stop resolve_ai_ci || true
