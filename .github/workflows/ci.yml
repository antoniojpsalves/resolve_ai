name: CI

on:
  push:
    branches: [main]
  pull_request:

# O job `docker` (build da imagem + smoke test em /api/v1/health) entra na
# Tarefa 4 do Dia 4.
jobs:
  quality:
    name: Lint, tipos e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-nao-usar-em-producao

  test:
    name: Testes unitários e de integração
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_test?schema=public
      AUTH_SECRET: ci-test-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    name: Testes e2e (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_ai_e2e?schema=public
      AUTH_SECRET: ci-e2e-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Popular banco (seed)
        run: npm run db:seed

      - name: Build de produção
        run: npm run build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar jornadas e2e
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
