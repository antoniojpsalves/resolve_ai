services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - resolve_ai_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve_ai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resolve']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve_ai_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resolve']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx prisma generate && npm run dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next
    env_file:
      - .env
    # O .env é compartilhado com o fluxo de dev no host, onde `localhost`
    # é o valor correto (as portas do Postgres são publicadas no host).
    # Dentro da rede do compose, porém, `localhost` aponta para o próprio
    # container `app`, não para `db`/`db-test`. Por isso sobrescrevemos as
    # duas URLs aqui com os nomes de serviço e a porta interna 5432 — o
    # bloco `environment:` tem precedência sobre `env_file:`.
    environment:
      DATABASE_URL: postgresql://resolve:resolve@db:5432/resolve_ai?schema=public
      DATABASE_URL_TEST: postgresql://resolve:resolve@db-test:5432/resolve_ai_test?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  resolve_ai_db:
  node_modules:
  next_build:
